name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Version check
        run: node -e "const v=require('./package.json').version; const c=require('fs').readFileSync('rotary_knob_card.js','utf-8').match(/VERSION\\s*=\\s*['\"]([^'\"]+)['\"]/)[1]; if(v!==c) {console.error('package.json version ('+v+') does not match card VERSION ('+c+')'); process.exit(1)} console.log('Versions match: '+v)"

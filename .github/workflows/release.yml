name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check version consistency
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Check package.json version matches card JS VERSION
          node scripts/check-version.cjs
          
          # Check tag matches package.json (for non-pre-release tags only)
          if [[ "$TAG" != *-* ]]; then
            VERSION=$(node -p "require('./package.json').version")
            if [ "v$VERSION" != "$TAG" ]; then
              echo "Tag $TAG does not match package.json version $VERSION" >&2
              exit 1
            fi
          fi

      - name: Extract release notes
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/extract-release-notes.cjs "$TAG"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: rotary_knob_card.js
          body_path: RELEASE_NOTES.md
          prerelease: ${{ contains(github.ref_name, '-') }}
